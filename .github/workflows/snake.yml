name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bardock7238
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # snk solo acepta paletas fijas (todas verdes); repintamos a rosa.
      - name: Recolorear a rosa
        run: |
          sed -i 's/#01311f/#3d1f2c/g; s/#034525/#7a2e4d/g; s/#0f6d31/#b8426e/g; s/#00c647/#f778ba/g; s/purple/#f778ba/g' dist/github-contribution-grid-snake-dark.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
